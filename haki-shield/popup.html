<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haki Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark">H</span>
      <div class="brand-text"><strong>Haki Shield</strong><small>Ad Blocker</small></div>
    </div>
    <span class="status" id="status">ON</span>
  </header>

  <main>
    <section class="card">
      <button class="row" data-toggle="enabled">
        <svg viewBox="0 0 24 24"><path d="M12 3v9M5.6 5.6a9 9 0 1 0 12.8 0"/></svg>
        <span class="txt"><b>Master switch</b><small>Everything on / off</small></span>
        <span class="switch"></span>
      </button>
      <button class="row" data-toggle="networkAds">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
        <span class="txt"><b>Network ads</b><small>Requests &amp; trackers</small></span>
        <span class="switch"></span>
      </button>
      <button class="row" data-toggle="universal">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3.2 3.2 14.8 0 18M12 3c-3.2 3.2-3.2 14.8 0 18"/></svg>
        <span class="txt"><b>Universal ads</b><small>Public list, all websites</small></span>
        <span class="switch"></span>
      </button>
      <button class="row" data-toggle="videoAds">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="m10 9 5 3-5 3z"/></svg>
        <span class="txt"><b>Video ads</b><small>Twitch stream ads</small></span>
        <span class="switch"></span>
      </button>
      <button class="row" data-toggle="banners">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>
        <span class="txt"><b>Banners</b><small>Hide ad blocks on pages</small></span>
        <span class="switch"></span>
      </button>
    </section>

    <section class="card site-card">
      <div class="site-head"><span class="dot" id="siteDot"></span><span class="host" id="host">This site</span></div>
      <button class="site-btn" id="siteBtn">Disable on this site</button>
    </section>

    <section class="summary">
      <span>Blocked on this site</span><strong id="blocked">0</strong>
    </section>

    <button class="settings" id="openSettings">Open settings <span>→</span></button>
  </main>

  <footer>Made by Haki <span>•</span> v1.7.0</footer>
  <script src="popup.js"></script>
</body>
</html>
