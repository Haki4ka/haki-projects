<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haki OLED — Control</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="sheet">
    <header class="head">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M20.5 14.3A8.6 8.6 0 1 1 9.7 3.5a6.8 6.8 0 0 0 10.8 10.8Z"/></svg>
      </div>
      <div class="heading">
        <div class="title">Haki OLED</div>
        <div class="subtitle">One-click control</div>
      </div>
      <span class="badge">v3</span>
    </header>

    <div class="rows">
      <div class="row" id="themeRow">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="4.5" width="18" height="12" rx="2"/>
            <path d="M8 20h8M12 16.5V20"/>
            <path class="glow" d="M12 7.2v6.6M9.3 10.5h5.4"/>
          </svg>
        </span>
        <span class="meta">
          <span class="name">Browser theme</span>
          <span class="hint">Deep black browser frame and tabs</span>
        </span>
        <label class="switch" title="Toggle the black browser theme">
          <input type="checkbox" id="themeToggle" aria-label="Browser theme">
          <span class="track"><span class="thumb"></span></span>
        </label>
      </div>

      <div class="row" id="sitesRow">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5"/>
            <path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.2 3.6 8.5S14.4 18.2 12 20.5c-2.4-2.3-3.6-5.2-3.6-8.5S9.6 5.8 12 3.5Z"/>
          </svg>
        </span>
        <span class="meta">
          <span class="name">Site darkening</span>
          <span class="hint">Web pages in deep black</span>
        </span>
        <label class="switch" title="Toggle darkening of websites">
          <input type="checkbox" id="sitesToggle" aria-label="Site darkening">
          <span class="track"><span class="thumb"></span></span>
        </label>
      </div>
    </div>

    <section class="gray-box" id="grayBox">
      <div class="gray-head"><b>Gray-mode sites</b><small>Dark surfaces, no color inversion</small></div>
      <div class="gray-list" id="grayList"><span class="gray-empty" id="grayEmpty">No custom sites yet.</span></div>
      <div class="gray-input-row">
        <input class="gray-input" id="grayInput" type="text" placeholder="example.com" aria-label="Add gray-mode site" autocomplete="off" spellcheck="false">
        <button class="gray-add" id="grayAdd" type="button" disabled>Add</button>
      </div>
      <p class="gray-note">Subdomains are included. Changes apply to open tabs without reloading.</p>
    </section>

    <footer class="foot">
      <span class="status"><i class="dot" id="statusDot"></i><span id="statusText">Loading…</span></span>
      <kbd title="Turn both ON, press again to turn both OFF">Alt+Shift+D</kbd>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
